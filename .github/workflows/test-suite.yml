name: Test suite

on:
  workflow_dispatch:
  schedule:
    # Every day at 5:00am
    - cron: "0 5 * * *"
  pull_request:
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  test-linux:
    name: Tests on ${{ matrix.runner }} ${{ matrix.features }}
    runs-on: ${{ vars.CI_RUNNER_PROVIDER != 'github' && fromJSON('{"ubuntu-latest":"blacksmith-2vcpu-ubuntu-2404","ubuntu-24.04":"blacksmith-2vcpu-ubuntu-2404","ubuntu-24.04-arm":"blacksmith-2vcpu-ubuntu-2404-arm","ubuntu-22.04":"blacksmith-2vcpu-ubuntu-2204","ubuntu-22.04-arm":"blacksmith-2vcpu-ubuntu-2204-arm"}')[matrix.runner] || matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
        features: ["", "--features enterprise"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: check free space before
        run: df -h
      - name: Clean space as per https://github.com/actions/virtual-environments/issues/709
        run: |
          sudo rm -rf "/opt/ghc" || true
          sudo rm -rf "/usr/share/dotnet" || true
          sudo rm -rf "/usr/local/lib/android" || true
          sudo rm -rf "/usr/local/share/boost" || true
      - name: check free space after
        run: df -h
      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.features }}
      - name: Run cargo build without any default features
        run: cargo build --locked --no-default-features --all
      - name: Run cargo test
        run: cargo test --locked --all ${{ matrix.features }}

  test-windows:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
        features: ["", "--features enterprise"]
    if: github.event_name != 'merge_group'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run cargo build without any default features
        run: cargo build --locked --no-default-features --all
      - name: Run cargo test
        run: cargo test --locked --all ${{ matrix.features }}

  test-macos:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
        features: ["", "--features enterprise"]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run cargo build without any default features
        run: cargo build --locked --no-default-features --all
      - name: Run cargo test
        run: cargo test --locked --all ${{ matrix.features }}

  test-all-features:
    name: Tests almost all features
    runs-on: ${{ vars.CI_RUNNER_PROVIDER == 'github' && 'ubuntu-22.04' || 'blacksmith-2vcpu-ubuntu-2204' }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Clean space as per https://github.com/actions/virtual-environments/issues/709
        run: |
          sudo rm -rf "/opt/ghc" || true
          sudo rm -rf "/usr/share/dotnet" || true
          sudo rm -rf "/usr/local/lib/android" || true
          sudo rm -rf "/usr/local/share/boost" || true
      - name: Run cargo build with almost all features
        run: |
          cargo build --workspace --locked --features "$(cargo xtask list-features --exclude-feature cuda,test-ollama)"
      - name: Run cargo test with almost all features
        run: |
          cargo test --workspace --locked --features "$(cargo xtask list-features --exclude-feature cuda,test-ollama)"

  ollama-ubuntu:
    name: Test with Ollama
    runs-on: ${{ vars.CI_RUNNER_PROVIDER == 'github' && 'ubuntu-22.04' || 'blacksmith-2vcpu-ubuntu-2204' }}
    env:
      MEILI_TEST_OLLAMA_SERVER: "http://localhost:11434"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Clean space as per https://github.com/actions/virtual-environments/issues/709
        run: |
          sudo rm -rf "/opt/ghc" || true
          sudo rm -rf "/usr/share/dotnet" || true
          sudo rm -rf "/usr/local/lib/android" || true
          sudo rm -rf "/usr/local/share/boost" || true
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sudo -E sh
      - name: Start serving
        run: |
          # Run it in the background, there is no way to daemonise at the moment
          ollama serve &

          # A short pause is required before the HTTP port is opened
          sleep 5

          # This endpoint blocks until ready
          time curl -i http://localhost:11434

      - name: Pull nomic-embed-text & all-minilm
        run: |
          ollama pull nomic-embed-text
          ollama pull all-minilm

      - name: Run cargo test
        run: cargo test --locked -p meilisearch --features test-ollama ollama

  test-legacy-indexer:
    name: Test legacy settings indexer
    runs-on: ${{ vars.CI_RUNNER_PROVIDER == 'github' && 'ubuntu-22.04' || 'blacksmith-2vcpu-ubuntu-2204' }}
    env:
      MEILI_EXPERIMENTAL_NO_EDITION_2024_FOR_SETTINGS: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: check free space before
        run: df -h
      - name: Clean space as per https://github.com/actions/virtual-environments/issues/709
        run: |
          sudo rm -rf "/opt/ghc" || true
          sudo rm -rf "/usr/share/dotnet" || true
          sudo rm -rf "/usr/local/lib/android" || true
          sudo rm -rf "/usr/local/share/boost" || true
      - name: check free space after
        run: df -h
      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run cargo test
        run: cargo test --locked --all

  test-disabled-tokenization:
    name: Test disabled tokenization
    runs-on: ${{ vars.CI_RUNNER_PROVIDER == 'github' && 'ubuntu-22.04' || 'blacksmith-2vcpu-ubuntu-2204' }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Clean space as per https://github.com/actions/virtual-environments/issues/709
        run: |
          sudo rm -rf "/opt/ghc" || true
          sudo rm -rf "/usr/share/dotnet" || true
          sudo rm -rf "/usr/local/lib/android" || true
          sudo rm -rf "/usr/local/share/boost" || true
      - name: Run cargo tree without default features and check lindera is not present
        run: |
          if cargo tree -f '{p} {f}' -e normal --no-default-features | grep -qz lindera; then
            echo "lindera has been found in the sources and it shouldn't"
            exit 1
          fi
      - name: Run cargo tree with default features and check lindera is pressent
        run: |
          cargo tree -f '{p} {f}' -e normal | grep lindera -qz

  build:
    name: Build in release
    runs-on: ${{ vars.CI_RUNNER_PROVIDER == 'github' && 'ubuntu-22.04' || 'blacksmith-2vcpu-ubuntu-2204' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Clean space as per https://github.com/actions/virtual-environments/issues/709
        run: |
          sudo rm -rf "/opt/ghc" || true
          sudo rm -rf "/usr/share/dotnet" || true
          sudo rm -rf "/usr/local/lib/android" || true
          sudo rm -rf "/usr/local/share/boost" || true
      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

  clippy:
    name: Run Clippy
    runs-on: ${{ vars.CI_RUNNER_PROVIDER == 'github' && 'ubuntu-22.04' || 'blacksmith-2vcpu-ubuntu-2204' }}
    strategy:
      matrix:
        features: ["", "--features enterprise"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Clean space as per https://github.com/actions/virtual-environments/issues/709
        run: |
          sudo rm -rf "/opt/ghc" || true
          sudo rm -rf "/usr/share/dotnet" || true
          sudo rm -rf "/usr/local/lib/android" || true
          sudo rm -rf "/usr/local/share/boost" || true
      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run cargo clippy
        run: cargo clippy --all-targets ${{ matrix.features }} -- --deny warnings -D clippy::todo

  fmt:
    name: Run Rustfmt
    runs-on: ${{ vars.CI_RUNNER_PROVIDER == 'github' && 'ubuntu-22.04' || 'blacksmith-2vcpu-ubuntu-2204' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Clean space as per https://github.com/actions/virtual-environments/issues/709
        run: |
          sudo rm -rf "/opt/ghc" || true
          sudo rm -rf "/usr/share/dotnet" || true
          sudo rm -rf "/usr/local/lib/android" || true
          sudo rm -rf "/usr/local/share/boost" || true
      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  declarative-tests:
    name: Run declarative tests
    runs-on: ${{ vars.CI_RUNNER_PROVIDER == 'github' && 'ubuntu-22.04-arm' || 'blacksmith-2vcpu-ubuntu-2204-arm' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Clean space as per https://github.com/actions/virtual-environments/issues/709
        run: |
          sudo rm -rf "/opt/ghc" || true
          sudo rm -rf "/usr/share/dotnet" || true
          sudo rm -rf "/usr/local/lib/android" || true
          sudo rm -rf "/usr/local/share/boost" || true
      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run declarative tests
        run: |
          cargo xtask test workloads/tests/*.json
